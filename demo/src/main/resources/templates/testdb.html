<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>테스트 페이지</title>
</head>
<body>
    <h1>테스트 페이지 (다수 사용자 조회)</h1>

    <!-- 
      [기존 단건 조회 코드 주석 처리]
      <div>
          <span th:text="${data4.id}">ID</span>
          <span th:text="${data4.name}">이름</span>
      </div>
    -->

    <!-- 리스트 목록을 출력하는 테이블 -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
            </tr>
        </thead>
        <tbody>
            <!-- 컨트롤러에서 넘겨준 ${testList}를 반복 처리 -->
            <tr th:each="user : ${testList}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">홍길동</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
