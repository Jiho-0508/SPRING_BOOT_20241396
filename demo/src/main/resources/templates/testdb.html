<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>테스트 페이지</title>
</head>
<body>
    <h1>테스트 페이지 (다수 사용자 조회)</h1>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>나이</th>
            <th>성별</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="user : ${testList}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.name}">홍길동</td>
            <td th:text="${user.age}">20</td>
            <td th:text="${user.gender}">남성</td>
        </tr>
    </tbody>
</table>

</body>
</html>
